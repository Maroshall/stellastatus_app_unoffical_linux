name: Build Linux

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate icons
        run: npm run gen-icon

      - name: Generate logos
        run: npm run gen-logos

      - name: Build Linux AppImage
        run: npx electron-builder --linux AppImage --publish never

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: StellaStatus-Linux
          path: dist/*.AppImage
          if-no-files-found: error
