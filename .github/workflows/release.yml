name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Debug package version
        run: |
          echo "=== Current directory ==="
          pwd

          echo "=== Root package.json ==="
          node -e "const p=require('./package.json'); console.log('version =', p.version); console.log('fullVersion =', p.fullVersion)"

          echo "=== All package.json files ==="
          find . -name package.json -not -path './node_modules/*' -print

          echo "=== electron-builder config ==="
          if [ -f electron-builder.yml ]; then
            cat electron-builder.yml
          fi

          if [ -f electron-builder.yaml ]; then
            cat electron-builder.yaml
          fi

      - name: Check package version
        run: |
          echo "package.json version:"
          node -p "require('./package.json').version"

          echo "package.json fullVersion:"
          node -p "require('./package.json').fullVersion"

      - name: Generate icons
        run: npm run gen-icon

      - name: Generate logos
        run: npm run gen-logos

      - name: Build Linux AppImage
        run: npx electron-builder --linux AppImage --publish never

      - name: Rename AppImage
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"

          for file in dist/*.AppImage; do
            [ -e "$file" ] || continue

            base="$(basename "$file")"
            stem="${base%.AppImage}"
            product="${stem%-*}"

            mv "$file" "dist/${product}-${TAG_VERSION}.AppImage"
          done

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: StellaStatus-Linux
          path: dist/*.AppImage
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: 스텔라상태 ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: dist/*.AppImage
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
