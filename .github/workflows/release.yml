name: Release

# v* 태그를 푸시하면 Linux AppImage를 빌드하고
# GitHub Releases에 업로드한다.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate icons
        run: npm run gen-icon

      - name: Generate logos
        run: npm run gen-logos

      - name: Build Linux AppImage
        run: npx electron-builder --linux AppImage --publish never

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: StellaStatus-Linux
          path: dist/*.AppImage
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: 스텔라상태 ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: dist/*.AppImage
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
