name: Release

# v* 태그를 푸시하면 커스텀 인스톨러(스텔라상태 Setup.exe)를 빌드하고,
# (설정된 경우) SignPath Foundation 으로 코드 서명한 뒤 GitHub Releases 에 업로드한다.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build custom installer (스텔라상태 Setup.exe)
        run: npm run build-setup

      # ── 코드 서명(SignPath) ──────────────────────────────
      # 아래 리포지토리 변수/시크릿이 설정되면 자동으로 서명한다. (미설정 시 건너뜀)
      #   Variables: SIGNPATH_ORGANIZATION_ID, SIGNPATH_PROJECT_SLUG, SIGNPATH_SIGNING_POLICY_SLUG
      #   Secret:    SIGNPATH_API_TOKEN
      - name: Upload unsigned installer (for SignPath)
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        id: unsigned
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-setup
          path: dist-installer/스텔라상태 Setup.exe

      - name: Sign with SignPath
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: dist-installer

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: 스텔라상태 ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: dist-installer/*.exe
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
