name: Release

# v* 태그를 푸시하면 커스텀 인스톨러(스텔라상태 Setup.exe)를 빌드하고,
# (설정된 경우) SignPath Foundation 으로 코드 서명한 뒤 GitHub Releases 에 업로드한다.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build custom installer (스텔라상태 Setup.exe)
        run: npm run build-setup

      # ── 코드 서명(SignPath) ──────────────────────────────
      # 아래 리포지토리 변수/시크릿이 설정되면 자동으로 서명한다. (미설정 시 건너뜀)
      #   Variables: SIGNPATH_ORGANIZATION_ID, SIGNPATH_PROJECT_SLUG, SIGNPATH_SIGNING_POLICY_SLUG
      #   Secret:    SIGNPATH_API_TOKEN
      - name: Upload unsigned installer (for SignPath)
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        id: unsigned
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-setup
          path: dist-installer/스텔라상태 Setup.exe

      - name: Sign with SignPath
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: dist-installer

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: 스텔라상태 ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: dist-installer/*.exe
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── macOS(.dmg) ──────────────────────────────────────
  # .dmg 는 macOS 에서만 빌드 가능하므로 별도 러너에서 만든 뒤, 위에서 만든 같은 릴리스에 첨부한다.
  # (미서명 빌드 — 인증서 없이 산출물만. Gatekeeper 경고는 남는다.)
  build-mac:
    needs: build            # Windows 잡이 릴리스를 먼저 생성한 뒤 실행
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build macOS dmg (unsigned)
        # arch 를 명시하지 않으면 호스트(arm64)만 빌드된다. Intel(x64) 까지 만들려면 둘 다 지정.
        # ⚠️ productName 을 반드시 ASCII("StellaStatus")로 오버라이드한다.
        #    (electron-builder.yml 의 productName='스텔라상태' 를 그대로 쓰면 헬퍼 앱이
        #     '스텔라상태 Helper (GPU).app' 처럼 한글 경로가 되어, macOS 에서 앱이
        #     실행 시 SIGTRAP 으로 크래시한다. Windows 는 한글 productName 이 문제없다.)
        run: npx electron-builder --mac dmg --arm64 --x64 -c.productName=StellaStatus --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false   # 미서명: 키체인 인증서 자동탐색 비활성화

      - name: Upload dmg to release
        run: gh release upload "${{ github.ref_name }}" dist/*.dmg --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
